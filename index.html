<!doctype html>

    <!-- Structured data: LocalBusiness with verified contact details. -->
    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "VIP Transports",
        "url": "https://www.viptransports.in/",
        "description": "Transportation, goods distribution and fuel logistics services for businesses in Bengaluru.",

        "telephone": "+91-9916060602",
        "email": "Office@viptransports.in",
        "contactPoint": [
          { "@type": "ContactPoint", "telephone": "+91-9916060602", "contactType": "customer service" },
          { "@type": "ContactPoint", "telephone": "+91-9966696246", "contactType": "customer service" }
        ],
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "#213, 6th Cross, 2nd Stage, Arekere Mico Layout, BG Road",
          "addressLocality": "Bengaluru",
          "addressRegion": "Karnataka",
          "postalCode": "560076",
          "addressCountry": "IN"
        },
        "areaServed": "IN",
        "knowsAbout": [
          "Goods transportation",
          "Distribution services",
          "Fuel distribution",
          "Logistics"
        ]
      }
    </script>
    <!-- Home intro film: hide the navbar from the very first paint (no fade-out flash).
         Mirrors shouldPlayIntro() in src/components/sections/Hero.tsx. -->
    <script>
      (function () {
        try {
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (location.pathname === '/' && !reduce && sessionStorage.getItem('vip-intro-seen') !== '1') {
            document.documentElement.classList.add('intro-on');
          }
        } catch (e) {}
      })();
    </script>
